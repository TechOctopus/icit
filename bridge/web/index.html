<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111" />
    <title>icit</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="title">icit <span id="bridgeDot" class="dot" title="bridge"></span><span id="extDot" class="dot" title="extension"></span></div>
      <div class="hdr-actions">
        <button id="btnSnapshot" class="ghost" title="Снимок страницы">snap</button>
        <button id="btnShot" class="ghost" title="Скриншот">shot</button>
        <button id="btnReset" class="ghost" title="Новый диалог">new</button>
        <button id="btnSettings" class="ghost">⚙︎</button>
      </div>
    </header>

    <main id="log"></main>

    <footer>
      <textarea id="input" rows="1" placeholder="Что сделать во вкладке на ПК?"></textarea>
      <button id="btnSend">▶</button>
      <button id="btnStop" hidden>■</button>
    </footer>

    <dialog id="settings">
      <form method="dialog">
        <h2>Настройки</h2>
        <label>Anthropic API key
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…" />
        </label>
        <label>Модель
          <select id="model">
            <option value="claude-opus-5-5">claude-opus-5-5 (по умолчанию)</option>
            <option value="claude-sonnet-5-5">claude-sonnet-5-5</option>
            <option value="claude-haiku-5-5">claude-haiku-5-5</option>
            <option value="claude-fable-5-1">claude-fable-5-1</option>
          </select>
        </label>
        <label>Effort
          <select id="effort">
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
          </select>
        </label>
        <label>API base URL (обычно пусто)
          <input id="baseUrl" placeholder="https://api.anthropic.com" />
        </label>
        <label>Токен моста (ICIT_TOKEN, если задан)
          <input id="token" autocomplete="off" />
        </label>
        <p class="muted">Ключ хранится только в localStorage этого телефона. Запросы к API уходят с телефона напрямую, ПК их не видит.</p>
        <div class="dlg-actions"><button id="btnSaveSettings" value="save">Сохранить</button></div>
      </form>
    </dialog>

    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
